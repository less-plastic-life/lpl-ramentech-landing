<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1626">
  <title>Less Plastic Life · RAMEN TECH 2026</title>
  <meta name="description" content="Less Plastic Life — bioplastic made from resources that were once thrown away.">
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 첫 화면 배경: 일상 속 사용 장면 4컷 -->
  <div class="bg" aria-hidden="true">
    <img class="c1" src="assets/img/bg-cafe.jpg" alt="" decoding="async">
    <img class="c2" src="assets/img/bg-lunch.jpg" alt="" decoding="async">
    <img class="c3" src="assets/img/bg-cosmetic.jpg" alt="" decoding="async">
    <img class="c4" src="assets/img/bg-crate.jpg" alt="" decoding="async">
  </div>

  <div class="app">
    <header class="top">
      <p class="tagline" id="tagline"></p>
      <nav class="langs" id="langs" aria-label="Language"></nav>
    </header>

    <main class="main">
      <div class="ring" id="ring">
        <div class="track" aria-hidden="true"></div>
        <img class="logo" src="assets/logo.png" alt="Less Plastic Life" width="720" height="315">
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <footer class="foot" id="foot"></footer>
  </div>

  <!-- 카드 상세(뒤집기) -->
  <div class="detail" id="detail" hidden role="dialog" aria-modal="true">
    <div class="backdrop" id="backdrop"></div>
    <button class="close" id="close" type="button" aria-label="Close">&times;</button>

    <div class="scene">
      <div class="flip" id="flip">
        <div class="face front">
          <img id="frontImg" alt="" draggable="false">
          <div class="front-caption"><span id="frontName"></span></div>
        </div>
        <div class="face back" id="back"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/content.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
